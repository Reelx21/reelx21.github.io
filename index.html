<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Reelx21</title>
  <meta name="description" content="Reelx21 - short vertical video feed">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Reelx21</div>
    <div class="version">V3</div>
  </header>

  <main id="feed" class="feed" aria-label="Video feed"></main>

  <div id="empty" class="empty" hidden>
    <h2>Belum ada video</h2>
    <p>Tambahkan URL Cloudinary di <code>js/videos.js</code>.</p>
  </div>

  <script src="js/videos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
